name: video-promotional

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-promotional
    restart: unless-stopped
    environment:
      # AI backend + provider (see .env / .env.example for meaning).
      AI_BACKEND: ${AI_BACKEND:-agent_sdk}
      AI_ENDPOINT: ${AI_ENDPOINT:-http://oneapi.yhroot.com/v1/chat/completions}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-glm-4.6-chat}
      AI_TIMEOUT: ${AI_TIMEOUT:-120}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      # Claude Agent SDK / Anthropic protocol. Blank => derived from AI_* above.
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}
      # TTS + render tuning (VibeVoice runs on the host — see README).
      AIWORK_ROOT: ${AIWORK_ROOT:-/app/aiwork}
      TTS_DEVICE: ${TTS_DEVICE:-cpu}
      TTS_DEFAULT_MODEL: ${TTS_DEFAULT_MODEL:-vibevoice-1.5b}
      TTS_DEFAULT_VOICE_1: ${TTS_DEFAULT_VOICE_1:-Carter}
      TTS_DEFAULT_VOICE_2: ${TTS_DEFAULT_VOICE_2:-Alice}
      HYPERFRAMES_VERSION: ${HYPERFRAMES_VERSION:-0.6.99}
      RENDER_FPS: ${RENDER_FPS:-15}
      RENDER_QUALITY: ${RENDER_QUALITY:-draft}
      RENDER_WORKERS: ${RENDER_WORKERS:-2}
      # Container data paths (mapped to the named volumes below).
      OUTPUTS_DIR: /app/outputs
      UPLOADS_DIR: /app/uploads
      DB_PATH: /app/data/tasks.db
    ports:
      - "${APP_PORT:-8100}:8100"
    volumes:
      # Bind runtime data to this repository on the external drive so generated
      # videos, uploads, and the task database do not live in Docker.raw.
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8100/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
