<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
      background: #fbfbf8;
      color: #17211c;
    }

    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 28%, rgba(55, 120, 93, 0.18), transparent 380px),
        radial-gradient(circle at 76% 72%, rgba(24, 65, 118, 0.14), transparent 430px),
        #fbfbf8;
    }

    .title-card,
    .outro-card {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 130px 220px;
      text-align: center;
      opacity: 0;
      animation: softCard 5s ease both;
      z-index: 10;
    }

    .outro-card {
      animation-duration: {{ outro_duration }}s;
    }

    .eyebrow {
      margin-bottom: 26px;
      color: #37785d;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1, h2 {
      max-width: 1220px;
      font-size: 76px;
      line-height: 1.08;
      font-weight: 600;
      color: #17211c;
    }

    .outro-card p {
      margin-top: 22px;
      color: #5f6964;
      font-size: 28px;
      line-height: 1.35;
    }

    .segment {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 150px 270px 180px;
      text-align: center;
      opacity: 0;
      animation:
        segmentIn {{ transition_duration }}s ease-out both,
        segmentOut {{ transition_duration }}s ease-in both;
    }

    .speaker {
      margin-bottom: 30px;
      color: #37785d;
      font-size: 24px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .quote {
      max-width: 1180px;
      color: #17211c;
      font-size: 58px;
      line-height: 1.25;
      font-weight: 500;
      text-wrap: balance;
    }

    .pulse {
      position: absolute;
      left: 50%;
      bottom: 82px;
      width: 680px;
      height: 6px;
      transform: translateX(-50%);
      background: rgba(23, 33, 28, 0.12);
      border-radius: 999px;
      overflow: hidden;
      z-index: 6;
    }

    .pulse-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #37785d, #184176);
      border-radius: inherit;
      animation: progress {{ audio_duration }}s linear forwards;
    }

    .character-frame {
      position: absolute;
      right: 82px;
      bottom: 82px;
      width: 220px;
      height: 220px;
      z-index: 8;
    }

    @keyframes softCard {
      0% { opacity: 0; transform: translateY(18px) scale(0.99); }
      18% { opacity: 1; transform: translateY(0) scale(1); }
      82% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-16px) scale(0.99); }
    }

    @keyframes segmentIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes segmentOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-18px); }
    }

    @keyframes progress {
      from { width: 0%; }
      to { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="stage"
       data-composition-id="podcast"
       data-width="1920"
       data-height="1080"
       data-duration="{{ total_duration }}">
    <div data-start="0" data-duration="5" data-track-index="1">
      <div class="title-card">
        <div class="eyebrow">A Podcast Discussion</div>
        <h1>{{ title }}</h1>
      </div>
    </div>

    {% for seg in segments %}
    <div data-start="{{ seg.start }}" data-duration="{{ seg.duration }}" data-track-index="2">
      <div class="segment" style="animation-delay: 0s, calc({{ seg.duration }}s - {{ transition_duration }}s);">
        {% if not is_monologue %}<div class="speaker">Speaker {{ seg.speaker }}</div>{% endif %}
        <div class="quote">{{ seg.text }}</div>
      </div>
    </div>
    {% endfor %}

    <div data-start="{{ content_start }}" data-duration="{{ audio_duration }}" data-track-index="3">
      <div class="pulse"><div class="pulse-bar"></div></div>
    </div>

    {% if include_character %}
    <div data-start="{{ content_start }}" data-duration="{{ audio_duration }}" data-track-index="4">
      <div class="character-frame">
        <div id="hf-character" style="width: 100%; height: 100%;"></div>
      </div>
    </div>
    {% endif %}

    <div data-start="{{ outro_start }}" data-duration="{{ outro_duration }}" data-track-index="5">
      <div class="outro-card">
        <h2>Thanks for listening</h2>
        <p>Generated by Video Promotional</p>
      </div>
    </div>

    <audio id="podcast-audio" src="{{ audio_path }}" data-start="{{ content_start }}"></audio>
  </div>

  {% if include_character %}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  <script>
    const __hfCharacter = lottie.loadAnimation({
      container: document.getElementById("hf-character"),
      renderer: "svg",
      loop: true,
      autoplay: false,
      path: "{{ character_path }}",
    });
    window.__hfLottie = window.__hfLottie || [];
    window.__hfLottie.push(__hfCharacter);
  </script>
  {% endif %}
</body>
</html>
