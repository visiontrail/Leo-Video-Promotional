<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #0a0a1a;
    }

    .background {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 40%, #0d1b2a 100%);
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(100, 120, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100, 120, 255, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .title-card {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeInOut 5s ease forwards;
    }

    .title-card h1 {
      color: #e8e8ff;
      font-size: 56px;
      font-weight: 700;
      text-align: center;
      max-width: 1400px;
      line-height: 1.3;
      text-shadow: 0 0 40px rgba(100, 120, 255, 0.3);
    }

    .title-card .subtitle {
      color: #8888aa;
      font-size: 28px;
      margin-top: 20px;
      font-weight: 400;
    }

    .content-area {
      position: absolute;
      top: 80px;
      left: 100px;
      right: 100px;
      bottom: 100px;
    }

    .speaker-label {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .speaker-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    .speaker-dot.s1 { background: #6478ff; box-shadow: 0 0 12px rgba(100, 120, 255, 0.5); }
    .speaker-dot.s2 { background: #ff6478; box-shadow: 0 0 12px rgba(255, 100, 120, 0.5); }

    .speaker-name {
      color: #aaaacc;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .quote-text {
      position: absolute;
      top: 120px;
      left: 0;
      right: 400px;
      color: #d8d8f0;
      font-size: 38px;
      font-weight: 400;
      line-height: 1.6;
      opacity: 0;
    }

    .waveform-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .wave-bar {
      width: 4px;
      background: rgba(100, 120, 255, 0.4);
      border-radius: 2px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, #6478ff, #ff6478);
      border-radius: 2px;
    }

    .segment {
      position: absolute;
      inset: 0;
      opacity: 0;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateY(20px); }
      15% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-10px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scaleY(0.3); }
      50% { transform: scaleY(1); }
    }

    @keyframes progress {
      from { width: 0%; }
      to { width: 100%; }
    }
  </style>
</head>
<body>
  <div data-composition-id="podcast"
       data-width="1920"
       data-height="1080"
       data-duration="{{ total_duration }}"
       style="position: relative; width: 1920px; height: 1080px;">

    <!-- Background -->
    <div data-start="0" data-duration="{{ total_duration }}" data-track-index="0">
      <div class="background"></div>
      <div class="grid-overlay"></div>
    </div>

    <!-- Title card -->
    <div data-start="0" data-duration="5" data-track-index="1">
      <div class="title-card">
        <h1>{{ title }}</h1>
        <div class="subtitle">A Podcast Discussion</div>
      </div>
    </div>

    <!-- Content segments -->
    {% for seg in segments %}
    <div data-start="{{ seg.start }}" data-duration="{{ seg.duration }}" data-track-index="2">
      <div class="content-area">
        <div class="speaker-label">
          <div class="speaker-dot s{{ seg.speaker }}"></div>
          <span class="speaker-name">Speaker {{ seg.speaker }}</span>
        </div>
        <div class="quote-text" style="animation: fadeIn 0.5s ease forwards;">
          {{ seg.text }}
        </div>
      </div>
    </div>
    {% endfor %}

    <!-- Waveform visualization -->
    <div data-start="0" data-duration="{{ total_duration }}" data-track-index="3">
      <div style="position: absolute; bottom: 40px; left: 100px; right: 100px;">
        <div class="waveform-area">
          {% for i in range(200) %}
          <div class="wave-bar" style="height: {{ range(15, 45) | random }}px; animation-delay: {{ (i * 0.02) }}s;"></div>
          {% endfor %}
        </div>
      </div>
    </div>

    <!-- Progress bar -->
    <div data-start="0" data-duration="{{ total_duration }}" data-track-index="4">
      <div class="progress-bar" style="animation: progress {{ total_duration }}s linear forwards;"></div>
    </div>

    {% if include_character %}
    <!-- Lottie character overlay -->
    <div data-start="0" data-duration="{{ total_duration }}" data-track-index="5">
      <div style="position: absolute; bottom: 80px; right: 60px; width: 220px; height: 220px;">
        <lottie-player src="{{ character_path }}" loop autoplay
                       style="width: 100%; height: 100%;"></lottie-player>
      </div>
    </div>
    {% endif %}

    <!-- Audio track -->
    <audio src="{{ audio_path }}" data-start="0"></audio>
  </div>
</body>
</html>
